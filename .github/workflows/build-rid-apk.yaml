name: build-rid-apk

# 推送到 main/master 或手动触发时构建。
# v7 起：固定签名（GitHub Secrets 注入 keystore），并自动发布 GitHub Release + update.json，供 APP 内 OTA。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_notes:
        description: '本次更新说明（写入 update.json 与 Release）'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许 gh release create 发布到 GitHub Releases
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # 仓库不提交二进制 gradle-wrapper.jar，云端首次生成 wrapper
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --no-daemon

      # 解码固定签名 keystore（base64 -> jks），路径经环境变量传给 Gradle
      - name: Decode release keystore
        env:
          RID_KEYSTORE_BASE64: ${{ secrets.RID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$RID_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 RID_KEYSTORE_BASE64 secret，无法固定签名"
            exit 1
          fi
          mkdir -p .ci-keystore
          echo "$RID_KEYSTORE_BASE64" | base64 -d > .ci-keystore/rid-release.jks
          echo "keystore bytes: $(wc -c < .ci-keystore/rid-release.jks)"

      # 构建固定签名 release APK（debug 也用同一签名，保证任意包都可被 OTA 覆盖）
      - name: Build signed release APK
        env:
          RID_KEYSTORE_FILE: ${{ github.workspace }}/.ci-keystore/rid-release.jks
          RID_KEYSTORE_PASSWORD: ${{ secrets.RID_KEYSTORE_PASSWORD }}
          RID_KEY_PASSWORD: ${{ secrets.RID_KEY_PASSWORD }}
          RID_KEYSTORE_ALIAS: ${{ secrets.RID_KEYSTORE_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # 定位产物并统一命名（固定文件名，配合 releases/latest/download 固定地址）
      - name: Collect APK and build update manifest
        id: pkg
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "found apk: $APK"
          mkdir -p dist
          cp "$APK" dist/RIDScanner-latest.apk
          SIZE=$(stat -c%s dist/RIDScanner-latest.apk)
          # 只匹配真正的赋值行（行首可有空格），排除 // 注释里的 versionCode 字样，避免取到 v7 的 7
          VCODE=$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          VNAME=$(grep -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | grep -oE '"[0-9.]+"' | tr -d '"')
          if [ -z "$VCODE" ]; then VCODE=3; fi
          if [ -z "$VNAME" ]; then VNAME="1.2.0"; fi
          NOTES="${{ github.event.inputs.release_notes }}"
          [ -z "$NOTES" ] && NOTES="RID 监测 v${VNAME}：应用内升级、启动自动定位、地图一键回到我位置、射频诊断面板等更新。"
          cat > dist/update.json <<JSON
          {
            "versionCode": ${VCODE},
            "versionName": "${VNAME}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/RIDScanner-latest.apk",
            "apkSize": ${SIZE},
            "releaseNotes": "${NOTES}"
          }
          JSON
          echo "apkSize=$SIZE"
          echo "--- update.json ---"
          cat dist/update.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rid-apk-release
          path: dist/
          retention-days: 30

      # 自动发布到 GitHub Release（latest 标签），APP 经 releases/latest/download 拉取
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 空域热更数据随 Release 一并发布（模板期为明确标注的占位数据，拿到 UOM 真实边界后只改 release-assets/airspace.json 重新发版即可）
          if [ -f release-assets/airspace.json ]; then
            cp release-assets/airspace.json dist/airspace.json
          fi
          TAG="v$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --title "RIDScanner $TAG" \
            --notes "$(cat dist/update.json)" \
            --latest \
            dist/RIDScanner-latest.apk dist/update.json dist/airspace.json
          echo "published $TAG"
