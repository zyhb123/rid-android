<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RID 移动监测</title>
<link rel="stylesheet" href="lib/leaflet.css">
<script src="lib/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:8px;left:8px;width:min(72vw,300px);max-height:74vh;overflow:auto;
    background:rgba(255,255,255,.96);border-radius:10px;padding:8px 10px;box-shadow:0 2px 12px rgba(0,0,0,.25);font-size:12px;transition:width .2s}
  #panel h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  #foldBtn{background:transparent;color:#2563eb;box-shadow:none;width:auto;padding:2px 6px;font-size:16px;font-weight:700;margin:0;line-height:1}
  #panel.folded{width:auto;max-height:none;overflow:visible}
  #panel.folded #body{display:none}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
  .ok{background:#2ecc71}.bad{background:#e74c3c}
  .item{padding:7px 5px;border-bottom:1px solid #eee;cursor:pointer;border-radius:6px}
  .item:hover{background:#f0f7ff}
  .item .t{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .item .meta{color:#555;margin-top:3px;line-height:1.5}
  .item .dist{color:#b45309;font-weight:700}
  .badge{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10.5px;font-weight:600;color:#fff}
  .b-ground{background:#64748b}.b-air{background:#16a34a}.b-emg{background:#dc2626}.b-fault{background:#ea580c}.b-unk{background:#94a3b8}
  button{width:100%;padding:9px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:14px;font-weight:600;margin-bottom:6px}
  button:disabled{background:#94a3b8}
  #stat{font-size:12px;color:#555;line-height:1.6}
  #diagBtn{background:#475569;font-size:12px;padding:7px;margin-bottom:4px}
  #locBtn{background:#0891b2;font-size:12px;padding:7px;margin-bottom:4px}
  #diagOut{display:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;line-height:1.5;
    background:#0f172a;color:#e2e8f0;border-radius:6px;padding:6px;margin:4px 0;white-space:pre-wrap;
    word-break:break-all;max-height:42vh;overflow:auto}
  .kv{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
  .kv .k{color:#64748b}.kv .v{text-align:right;font-weight:600;word-break:break-all}
  .note{color:#b45309;font-size:10.5px;line-height:1.4;margin-top:4px;background:#fef3c7;padding:4px 6px;border-radius:5px}
  .leaflet-popup-content{font-size:12px;line-height:1.55}
</style>
</head>
<body>
<div id="panel">
  <h3>🛰 RID 监测 <button id="foldBtn" type="button" onclick="App.fold()">—</button></h3>
  <div id="body">
    <button id="connBtn" type="button" onclick="App.connect()">🔌 连接串口</button>
    <button id="diagBtn" type="button" onclick="App.diagnose()">🔍 USB 诊断（连不上先点这个）</button>
    <button id="locBtn" type="button" onclick="App.locate()">📍 开启本机定位（算手机距离）</button>
    <pre id="diagOut"></pre>
    <div id="stat">未连接，接 OTG 扫描板后点上方按钮</div>
    <div id="list" style="margin-top:6px"></div>
  </div>
</div>
<div id="map"></div>
<script>
// ====================================================================
// 全局错误捕获：老 WebView 不兼容/任何 JS 报错直接显示到页面，截图即可定位
// ====================================================================
window.addEventListener('error',function(ev){
  try{
    var box=document.getElementById('stat');
    if(box){
      var msg='⚠️ JS错误: '+(ev.message||'未知')+(ev.filename?(' @'+String(ev.filename).split('/').pop()+':'+ev.lineno):'');
      box.innerHTML='<span style="color:#e74c3c;word-break:break-all">'+msg+'</span><br>'+box.innerHTML;
    }
  }catch(_){}
});

// ====================================================================
// RID 移动监测 v6：字段严格对齐固件 send_json 协议（main.c），全程 ES5。
// 固件真实字段：mac/interface/rssi/channel/rate/noise_floor/id_type/ua_type/
//   basic_id/drone_lat/drone_long/drone_altitude/height_agl/speed_horizontal/
//   speed_vertical/heading/status/pilot_lat/pilot_long/area_*/operator_id
// ====================================================================
(function(){
  'use strict';

  // ---------- 枚举表（数值取自 opendroneid.h，禁止臆造）----------
  var UA_TYPE = {
    0:'未声明', 1:'固定翼', 2:'直升机/多旋翼', 3:'倾斜旋翼', 4:'旋翼机',
    5:'轻型比空气重(<25kg)', 6:'滑翔机', 7:'自由气球', 8:'系留气球',
    9:'飞艇(动力)', 10:'伞兵伞', 11:'动力翼伞', 12:'滑翔伞',
    13:'滑翔伞(跳伞)', 14:'滑翔伞(牵引)', 15:'其他'
  };
  var ID_TYPE = {
    0:'无', 1:'序列号', 2:'民航注册号', 3:'UTM分配UUID', 4:'特定会话ID'
  };
  var STATUS = {
    0:'未声明', 1:'地面待机', 2:'空中飞行', 3:'紧急状态', 4:'RID系统故障'
  };
  function statusBadge(s){
    var cls={1:'b-ground',2:'b-air',3:'b-emg',4:'b-fault'}[s]||'b-unk';
    var txt=STATUS[s]||('状态'+s);
    return '<span class="badge '+cls+'">'+txt+'</span>';
  }

  // ---------- 工具 ----------
  function nv(v,d){return (v==null?d:v);}
  function esc(s){return String(nv(s,'')).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function num(v){return (typeof v==='number'&&isFinite(v))?v:null;}
  // 固件无效坐标用 0/NaN 占位，判定是否有效经纬度
  function validLatLng(la,ln){
    la=num(la); ln=num(ln);
    if(la==null||ln==null) return false;
    if(la===0&&ln===0) return false;
    return (la>=-90&&la<=90&&ln>=-180&&ln<=180);
  }
  function fmtDist(m){
    if(m==null) return '—';
    if(m<1000) return Math.round(m)+' 米';
    return (m/1000).toFixed(2)+' 公里';
  }
  // haversine 球面距离，返回米
  function haversine(lat1,lng1,lat2,lng2){
    var R=6371000, toRad=Math.PI/180;
    var dLat=(lat2-lat1)*toRad, dLng=(lng2-lng1)*toRad;
    var a=Math.sin(dLat/2)*Math.sin(dLat/2)+
          Math.cos(lat1*toRad)*Math.cos(lat2*toRad)*
          Math.sin(dLng/2)*Math.sin(dLng/2);
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }
  // RSSI 信号→粗略距离档（非精确测距，仅参考，需实地标定）
  function rssiRange(rssi){
    rssi=num(rssi);
    if(rssi==null) return '无信号数据';
    if(rssi>=-55) return '很近（约几十米内）';
    if(rssi>=-70) return '近（百米级）';
    if(rssi>=-85) return '中（数百米级）';
    return '远/信号弱（约500米以上）';
  }
  function rssiColor(rssi){
    rssi=num(rssi);
    if(rssi==null) return '#94a3b8';
    if(rssi>=-70) return '#16a34a';
    if(rssi>=-85) return '#d97706';
    return '#dc2626';
  }

  // ---------- GCJ-02 火星坐标（国内在线图必须转换，离线 OSM 可关掉）----------
  var outChina=function(lng,lat){return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271;};
  function tLat(x,y){var r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
    r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
    r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30.0))*2/3;return r;}
  function tLon(x,y){var r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
    r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
    r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r;}
  function w2g(lng,lat){
    if(outChina(lng,lat)) return [lat,lng];
    var a=6378245.0, ee=0.00669342162296594323;
    var dLat=tLat(lng-105.0,lat-35.0), dLon=tLon(lng-105.0,lat-35.0);
    var radLat=lat/180.0*Math.PI, magic=Math.sin(radLat);
    magic=1-ee*magic*magic; var sm=Math.sqrt(magic);
    dLat=(dLat*180.0)/((a*(1-ee))/(magic*sm)*Math.PI);
    dLon=(dLon*180.0)/(a/sm*Math.cos(radLat)*Math.PI);
    return [lat+dLat,lng+dLon];
  }

  // ---------- 状态 ----------
  var map=null, droneIcon=null, pilotIcon=null, phoneIcon=null;
  var drones={};          // key=mac -> 最新数据对象
  var order=[];           // 列表顺序
  var phone=null;         // 本机定位 {lat,lng,acc,src}
  var connected=false;
  var lineBuf='';
  var locTimer=null;

  function makeIcons(){
    droneIcon=L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,13],html:
      '<div style="font-size:22px;line-height:26px;text-align:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))">🛸</div>'});
    pilotIcon=L.divIcon({className:'',iconSize:[24,24],iconAnchor:[12,12],html:
      '<div style="font-size:20px;line-height:24px;text-align:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))">🧑‍✈️</div>'});
    phoneIcon=L.divIcon({className:'',iconSize:[24,24],iconAnchor:[12,12],html:
      '<div style="font-size:20px;line-height:24px;text-align:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))">📍</div>'});
  }

  // ---------- 距离汇总（每条无人机实时计算）----------
  function computeDist(d){
    // 飞手 ↔ 无人机：双方坐标都来自 RID 报文，无需本机定位
    if(validLatLng(d.drone_lat,d.drone_long)&&validLatLng(d.pilot_lat,d.pilot_long)){
      d.distPilot=haversine(d.pilot_lat,d.pilot_long,d.drone_lat,d.drone_long);
    } else { d.distPilot=null; }
    // 手机 ↔ 无人机：依赖本机定位
    if(phone&&validLatLng(d.drone_lat,d.drone_long)){
      d.distPhone=haversine(phone.lat,phone.lng,d.drone_lat,d.drone_long);
    } else { d.distPhone=null; }
  }

  function popupHtml(d){
    var h='<b>'+esc(UA_TYPE[d.ua_type]||('类型'+d.ua_type))+'</b> '+statusBadge(d.status)+'<br>';
    h+='<div class="kv"><span class="k">序列号/ID</span><span class="v">'+esc(nv(d.basic_id,'—'))+'</span></div>';
    h+='<div class="kv"><span class="k">ID类型</span><span class="v">'+esc(ID_TYPE[d.id_type]||d.id_type)+'</span></div>';
    h+='<div class="kv"><span class="k">MAC</span><span class="v">'+esc(nv(d.mac,'—'))+'</span></div>';
    h+='<div class="kv"><span class="k">信号RSSI</span><span class="v" style="color:'+rssiColor(d.rssi)+'">'+esc(nv(d.rssi,'—'))+' dBm</span></div>';
    h+='<div class="kv"><span class="k">接收方式</span><span class="v">'+esc(nv(d.interface,'—'))+'</span></div>';
    h+='<div class="kv"><span class="k">信道/速率</span><span class="v">'+esc(nv(d.channel,'—'))+' / '+esc(nv(d.rate,'—'))+'</span></div>';
    h+='<div class="kv"><span class="k">高度(海拔/离地)</span><span class="v">'+esc(nv(d.drone_altitude,'—'))+' / '+esc(nv(d.height_agl,'—'))+' m</span></div>';
    h+='<div class="kv"><span class="k">速度(水平/垂直)</span><span class="v">'+esc(nv(d.speed_horizontal,'—'))+' / '+esc(nv(d.speed_vertical,'—'))+' m/s</span></div>';
    h+='<div class="kv"><span class="k">航向</span><span class="v">'+esc(nv(d.heading,'—'))+'°</span></div>';
    h+='<div class="kv"><span class="k">飞手↔无人机</span><span class="v">'+fmtDist(d.distPilot)+'</span></div>';
    h+='<div class="kv"><span class="k">手机↔无人机</span><span class="v">'+fmtDist(d.distPhone)+'</span></div>';
    if(d.operator_id) h+='<div class="kv"><span class="k">运营人ID</span><span class="v">'+esc(d.operator_id)+'</span></div>';
    h+='<div class="note">信号粗估距离：'+rssiRange(d.rssi)+'（仅供参考，最大探测距离需实地标定）</div>';
    return h;
  }

  function upsert(d){
    var key=d.mac||d.basic_id||('u'+order.length);
    d.id=key;
    computeDist(d);
    if(!drones[key]){ order.unshift(key); }
    drones[key]=d;
    // 地图：无人机
    if(validLatLng(d.drone_lat,d.drone_long)){
      var gcj=w2g(d.drone_long,d.drone_lat);
      if(!d.marker){
        d.marker=L.marker(gcj,{icon:droneIcon}).addTo(map).bindPopup(popupHtml(d));
      } else {
        d.marker.setLatLng(gcj);
        d.marker.setPopupContent(popupHtml(d));
      }
    }
    // 地图：飞手
    if(validLatLng(d.pilot_lat,d.pilot_long)){
      var pgcj=w2g(d.pilot_long,d.pilot_lat);
      if(!d.pilotMarker){
        d.pilotMarker=L.marker(pgcj,{icon:pilotIcon}).addTo(map)
          .bindPopup('飞手位置<br>'+esc(nv(d.mac,'')));
      } else { d.pilotMarker.setLatLng(pgcj); }
    }
    render();
  }

  function render(){
    var listEl=document.getElementById('list');
    if(order.length===0){
      listEl.innerHTML='<div style="color:#94a3b8;padding:8px 2px">暂未收到无人机广播</div>';
      return;
    }
    var html='';
    for(var i=0;i<order.length;i++){
      var d=drones[order[i]];
      var title=UA_TYPE[d.ua_type]||('未知机型#'+d.ua_type);
      html+='<div class="item" data-id="'+esc(d.id)+'">';
      html+='<div class="t"><span>🛸 '+esc(title)+'</span>'+statusBadge(d.status)+'</div>';
      html+='<div class="meta">';
      html+='<div class="kv"><span class="k">序列号</span><span class="v">'+esc(nv(d.basic_id,'—'))+'</span></div>';
      html+='<div class="kv"><span class="k">信号</span><span class="v" style="color:'+rssiColor(d.rssi)+'">'+esc(nv(d.rssi,'—'))+' dBm · '+esc(nv(d.interface,''))+'</span></div>';
      html+='<div class="kv"><span class="k">飞手↔无人机</span><span class="v dist">'+fmtDist(d.distPilot)+'</span></div>';
      html+='<div class="kv"><span class="k">手机↔无人机</span><span class="v dist">'+fmtDist(d.distPhone)+'</span></div>';
      html+='<div class="kv"><span class="k">高度/速度</span><span class="v">'+esc(nv(d.drone_altitude,'—'))+'m · '+esc(nv(d.speed_horizontal,'—'))+'m/s</span></div>';
      html+='</div></div>';
    }
    listEl.innerHTML=html;
    var items=listEl.querySelectorAll('.item');
    for(var j=0;j<items.length;j++){
      items[j].addEventListener('click',(function(el){
        return function(){
          var dd=drones[el.getAttribute('data-id')];
          if(dd&&dd.marker){
            map.setView(dd.marker.getLatLng(),Math.max(map.getZoom(),15));
            dd.marker.openPopup();
          }
        };
      })(items[j]));
    }
  }

  // ---------- 串口数据解析（按固件协议逐字段读取，不再用错字段名）----------
  function handleLine(line){
    line=String(line);
    if(line.charAt(0)!=='{') return;     // 只处理 JSON
    var o;
    try{ o=JSON.parse(line); }catch(e){ return; }
    if(!o||o.type!=='drone'){
      // boot/wifi_debug/ble_debug 等非目标报文，忽略但不报错
      return;
    }
    // 直接保留固件原始字段名，仅做数值规整；坐标/距离在渲染层处理
    var d={
      mac:o.mac, interface:o.interface,
      rssi:num(o.rssi), channel:o.channel, rate:o.rate, noise_floor:num(o.noise_floor),
      id_type:num(o.id_type), ua_type:num(o.ua_type), basic_id:o.basic_id,
      drone_lat:num(o.drone_lat), drone_long:num(o.drone_long),
      drone_altitude:num(o.drone_altitude), height_agl:num(o.height_agl),
      speed_horizontal:num(o.speed_horizontal), speed_vertical:num(o.speed_vertical),
      heading:num(o.heading), status:num(o.status),
      pilot_lat:num(o.pilot_lat), pilot_long:num(o.pilot_long),
      area_count:o.area_count, area_radius:o.area_radius,
      area_ceiling:o.area_ceiling, area_floor:o.area_floor,
      operator_id:o.operator_id, ts:Date.now()
    };
    upsert(d);
  }

  // ---------- 本机定位 ----------
  function refreshPhone(){
    if(!window.AndroidLocation||!window.AndroidLocation.lastLocation) return;
    var raw;
    try{ raw=window.AndroidLocation.lastLocation(); }catch(e){ return; }
    var p;
    try{ p=JSON.parse(raw); }catch(e){ return; }
    if(p&&p.ok){
      phone={lat:p.lat,lng:p.lng,acc:p.acc,src:p.src};
      var gcj=w2g(phone.lng,phone.lat);
      if(!window._phoneMarker){
        window._phoneMarker=L.marker(gcj,{icon:phoneIcon}).addTo(map).bindPopup('本机位置（观测者）');
      } else { window._phoneMarker.setLatLng(gcj); }
      // 重算所有目标的手机距离
      for(var k in drones){ if(drones.hasOwnProperty(k)){ computeDist(drones[k]); } }
      render();
      var accTxt=(phone.acc!=null)?(' ±'+Math.round(phone.acc)+'m'):'';
      setStat('定位已开启'+accTxt+'，正在实时计算手机↔无人机距离',true);
    } else if(p&&p.reason==='no_permission'){
      setStat('定位权限未授予，点上方「开启本机定位」授权',false);
    }
  }

  function setStat(msg,ok){
    var el=document.getElementById('stat');
    var dot='<span class="dot '+(ok?'ok':'bad')+'"></span>';
    el.innerHTML=dot+esc(msg);
  }
  function setConnUI(isConn){
    connected=isConn;
    var btn=document.getElementById('connBtn');
    btn.textContent=isConn?'⏹ 断开串口':'🔌 连接串口';
    document.getElementById('stat').innerHTML='<span class="dot '+(isConn?'ok':'bad')+'"></span>'+
      (isConn?'已连接，等待无人机广播…':'未连接，接 OTG 扫描板后点上方按钮');
  }

  // ---------- 对外按钮接口 ----------
  window.App={
    fold:function(){
      document.getElementById('panel').classList.toggle('folded');
    },
    connect:function(){
      var bridge=window.AndroidSerial;
      if(!bridge){ setStat('原生串口桥未注入，请重启 APP',false); return; }
      try{
        if(bridge.isConnected&&bridge.isConnected()){ bridge.disconnect(); return; }
        bridge.connect();
        setStat('正在请求 USB / 打开串口…',true);
      }catch(e){ setStat('连接调用异常：'+e.message,false); }
    },
    diagnose:function(){
      var bridge=window.AndroidSerial;
      var out=document.getElementById('diagOut');
      out.style.display='block';
      if(!bridge){ out.textContent='原生串口桥未注入'; return; }
      var txt='';
      try{
        // 设备明细（VID/PID/驱动/授权），桥已提供 driversInfo()
        if(bridge.driversInfo){
          var info=bridge.driversInfo();
          txt+='匹配串口设备：'+info+'\n\n';
        }
        txt+='—— 完整诊断 ——\n'+bridge.diagnose();
      }catch(e){ txt='诊断调用异常：'+e.message; }
      out.textContent=txt;
    },
    locate:function(){
      if(!window.AndroidLocation){ setStat('定位桥未注入（需新版 APP）',false); return; }
      refreshPhone();
      if(locTimer){ clearInterval(locTimer); }
      locTimer=setInterval(refreshPhone,3000);   // 每3秒刷新本机位置与距离
    }
  };

  // ---------- 原生回调（由 SerialJsBridge / MainActivity 注入调用）----------
  window.onNativeSerialLine=function(line){
    // 桥可能整行回传，也可能分包；做一层缓冲按 \n 切
    lineBuf+=String(line);
    var idx;
    while((idx=lineBuf.indexOf('\n'))>=0){
      var one=lineBuf.substring(0,idx);
      lineBuf=lineBuf.substring(idx+1);
      if(one) handleLine(one);
    }
    // 单包即完整 JSON（无换行）的兜底
    if(lineBuf.charAt(0)==='{'&&lineBuf.length>2&&lineBuf.charAt(lineBuf.length-1)==='}'){
      handleLine(lineBuf); lineBuf='';
    }
  };
  window.onNativeSerialState=function(isConn,msg){
    setConnUI(!!isConn);
    if(msg){ setStat(msg,!!isConn); }
  };

  // ---------- 地图初始化（放最后，地图失败不影响按钮/定位/解析）----------
  try{
    if(!window.L){ throw new Error('Leaflet 库未加载（lib/leaflet.js 缺失）'); }
    makeIcons();
    map=L.map('map',{zoomControl:false}).setView([19.68,109.68],10);
    L.control.zoom({position:'bottomright'}).addTo(map);
    L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{
      subdomains:['1','2','3','4'], maxZoom:18, attribution:'高德地图(GCJ-02)'
    }).addTo(map);
    render();
    // 若已默认授权定位，静默尝试一次
    if(window.AndroidLocation&&window.AndroidLocation.hasPermission&&window.AndroidLocation.hasPermission()){
      window.App.locate();
    }
  }catch(e){
    setStat('地图初始化失败：'+e.message+'（按钮与串口仍可用）',false);
  }
})();
</script>
</body>
</html>
