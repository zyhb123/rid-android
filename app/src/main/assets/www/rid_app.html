<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RID 移动监测</title>
<link rel="stylesheet" href="lib/leaflet.css">
<script src="lib/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:8px;left:8px;width:min(58vw,228px);max-height:60vh;overflow:auto;
    background:rgba(255,255,255,.95);border-radius:10px;padding:8px 10px;box-shadow:0 2px 12px rgba(0,0,0,.25);font-size:12px;transition:width .2s}
  #panel h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  #foldBtn{background:transparent;color:#2563eb;box-shadow:none;width:auto;padding:2px 6px;font-size:16px;font-weight:700;margin:0;line-height:1}
  #panel.folded{width:auto;max-height:none;overflow:visible}
  #panel.folded #body{display:none}
  .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px solid #eee}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
  .ok{background:#2ecc71}.bad{background:#e74c3c}
  .item{padding:6px 4px;border-bottom:1px solid #eee;cursor:pointer}
  .item:hover{background:#f0f7ff}
  .item b{font-size:13px}.item small{color:#666}
  button{width:100%;padding:9px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:14px;font-weight:600;margin-bottom:6px}
  button:disabled{background:#94a3b8}
  #stat{font-size:12px;color:#555;line-height:1.6}
  #diagBtn{background:#475569;font-size:12px;padding:7px;margin-bottom:4px}
  #diagOut{display:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;line-height:1.5;
    background:#0f172a;color:#e2e8f0;border-radius:6px;padding:6px;margin:4px 0;white-space:pre-wrap;
    word-break:break-all;max-height:38vh;overflow:auto}
  .leaflet-popup-content{font-size:12px;line-height:1.55}
</style>
</head>
<body>
<div id="panel">
  <h3>🛰 RID 监测 <button id="foldBtn" type="button" onclick="App.fold()">—</button></h3>
  <div id="body">
    <button id="connBtn" type="button" onclick="App.connect()">🔌 连接串口</button>
    <button id="diagBtn" type="button" onclick="App.diagnose()">🔍 USB 诊断（连不上先点这个）</button>
    <pre id="diagOut"></pre>
    <div id="stat">未连接，接 OTG 扫描板后点上方按钮</div>
    <div id="list" style="margin-top:6px"></div>
  </div>
</div>
<div id="map"></div>
<script>
// ====================================================================
// 全局错误捕获：老 WebView 不兼容/任何 JS 报错直接显示到页面，截图即可定位
// ====================================================================
window.addEventListener('error',function(ev){
  try{
    var box=document.getElementById('stat');
    if(box){
      var msg='⚠️ JS错误: '+(ev.message||'未知')+(ev.filename?(' @'+String(ev.filename).split('/').pop()+':'+ev.lineno):'');
      box.innerHTML='<span style="color:#e74c3c;word-break:break-all">'+msg+'</span><br>'+box.innerHTML;
    }
  }catch(_){}
});

// ====================================================================
// 全部业务逻辑放进一个 IIFE，App 挂 window 供内联 onclick 调用。
// 关键：按钮处理函数在【地图初始化之前】就定义好，地图即使报错也不影响按钮。
// 全程 ES2015 语法（不用 ?? / 可选链等 ES2020），兼容老安卓 WebView。
// ====================================================================
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  function nv(v,d){return (v==null?d:v);}
  function esc(s){return String(nv(s,'')).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

  // ===== WGS84 -> GCJ02（高德底图纠偏）=====
  var PI=3.14159265358979324, A=6378245.0, EE=0.00669342162296594323;
  function outChina(lng,lat){return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271;}
  function tLat(x,y){var r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
   r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;
   r+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30.0))*2/3;return r;}
  function tLon(x,y){var r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
   r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;
   r+=(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3;return r;}
  function w2g(lng,lat){
   if(outChina(lng,lat))return[lat,lng];
   var dLat=tLat(lng-105.0,lat-35.0),dLon=tLon(lng-105.0,lat-35.0);
   var rLat=lat/180.0*PI;var magic=Math.sin(rLat);magic=1-EE*magic*magic;var sm=Math.sqrt(magic);
   dLat=(dLat*180.0)/((A*(1-EE))/(magic*sm)*PI);dLon=(dLon*180.0)/(A/sm*Math.cos(rLat)*PI);
   return[lat+dLat,lng+dLon];
  }

  // ===== 状态 =====
  var map=null;            // 地图实例，初始化失败保持 null
  var mapReady=false;      // 地图是否可用
  var drones={};
  var connected=false;
  var stats={wifi:0,ble:0,last:''};
  var droneIcon=null, pilotIcon=null;

  function makeIcons(){
    if(!window.L) return;
    droneIcon=L.divIcon({className:'',html:'<div style="font-size:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))">🛸</div>',iconSize:[30,30],iconAnchor:[15,15]});
    pilotIcon=L.divIcon({className:'',html:'<div style="font-size:24px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))">🧑‍✈️</div>',iconSize:[26,26],iconAnchor:[13,13]});
  }

  function popupHtml(d){
    var rows=[
      ['序号',d.sn],['UA 类型',d.ua_type],['状态',d.status],['距离',d.distance_m!=null?d.distance_m+' m':'-'],
      ['高度',d.height_m!=null?d.height_m+' m':'-'],['速度',d.speed_mps!=null?d.speed_mps+' m/s':'-'],
      ['经纬度',d.lat?d.lat.toFixed(6)+', '+d.lng.toFixed(6):'-'],['高度类型',d.alt_type],['航向',d.direction_deg!=null?d.direction_deg+'°':'-'],
      ['GPS',d.gps_num],['频点',d.freq_mhz?d.freq_mhz+' MHz':'-'],['RID 版本',d.rid_ver],
      ['时间戳',d.timestamp],['MAC',d.mac],['飞行员距离',d.pilot_distance_m!=null?d.pilot_distance_m+' m':'-']
    ];
    return rows.map(function(r){return '<b>'+esc(r[0])+'</b>：'+esc(r[1]);}).join('<br>');
  }

  function upsert(o){
    var id=o.mac||o.sn||('u'+Object.keys(drones).length);
    if(!drones[id])drones[id]={id:id};
    var d=drones[id];
    var keys=['sn','ua_type','status','distance_m','height_m','speed_mps','lat','lng','alt_type',
      'direction_deg','gps_num','freq_mhz','rssi_dbm','rid_ver','timestamp','mac','pilot_lat','pilot_lng','pilot_distance_m'];
    for(var i=0;i<keys.length;i++){var k=keys[i];if(o[k]!=null)d[k]=o[k];}
    d.seen=Date.now();
    if(mapReady&&d.lat!=null){
      var gcj=w2g(d.lng,d.lat);
      if(!d.marker){
        d.marker=L.marker(gcj,{icon:droneIcon}).addTo(map).bindPopup(popupHtml(d));
      }else{
        d.marker.setLatLng(gcj);
        d.marker._popup&&d.marker._popup.setContent(popupHtml(d));
      }
      if(d.pilot_lat!=null){
        var pgcj=w2g(d.pilot_lng,d.pilot_lat);
        if(!d.pilotMarker)d.pilotMarker=L.marker(pgcj,{icon:pilotIcon}).addTo(map).bindPopup('飞行员 '+esc(nv(d.mac,'')));
        else d.pilotMarker.setLatLng(pgcj);
      }
    }
  }

  function render(){
    var list=Object.values(drones);
    var connColor=connected?'#16a34a':'#94a3b8';
    var connTxt=connected?'已连接':'未连接';
    var html='<div class="row"><span><span class="dot" style="background:'+connColor+'"></span>'+connTxt+'</div>';
    html+='<div class="row"><span>WiFi 管理帧</span><b>'+stats.wifi+'</b></div>';
    html+='<div class="row"><span>BLE 广播</span><b>'+stats.ble+'</b></div>';
    html+='<div class="row"><span>最近更新</span><b>'+esc(stats.last||'-')+'</b></div>';
    html+='<div class="row"><span>在线目标</span><b style="color:#2563eb">'+list.length+'</b></div>';
    if(list.length===0){
      html+='<div style="padding:10px 4px;color:#999;font-size:12px">等待 RID 数据…</div>';
    }else{
      list.forEach(function(d){
        var stale=(Date.now()-(d.seen||0))>15000;
        html+='<div class="item" data-id="'+esc(d.id)+'"><b>'+esc(nv(d.ua_type,'未知'))+'</b> '
          +(stale?'<small style="color:#e74c3c">●超时</small>':'<small style="color:#16a34a">●在线</small>')
          +'<br><small>'+esc(nv(d.mac,'-'))+'</small><br>'
          +'<small>高度 '+(d.height_m!=null?d.height_m+'m':'-')+' · 距离 '+(d.distance_m!=null?d.distance_m+'m':'-')+' · '+(d.freq_mhz?d.freq_mhz+'MHz':'-')+'</small></div>';
      });
    }
    $('list').innerHTML=html;
    if(mapReady){
      Array.prototype.forEach.call(document.querySelectorAll('.item'),function(el){
        el.onclick=function(){
          var dd=drones[el.getAttribute('data-id')];
          if(dd&&dd.marker)map.openPopup(dd.marker._popup,dd.marker.getLatLng());
        };
      });
    }
  }

  function handleLine(line){
    if(!line||line.indexOf('{')!==0)return;
    try{
      var o=JSON.parse(line);
      stats.last=new Date().toLocaleTimeString();
      if(o.type==='drone')upsert(o);
      else if(o.type==='wifi_debug')stats.wifi=nv(o.mgmt_total,stats.wifi);
      else if(o.type==='ble_debug')stats.ble=nv(o.adv_total,stats.ble);
    }catch(e){}
    render();
  }

  // ===== 按钮处理（最先就绪，挂 window）=====
  var App={
    connect:function(){
      if(!window.AndroidSerial){
        $('stat').innerHTML='<span style="color:#e74c3c">原生串口桥未就绪，请用 APK 打开本页</span>';
        return;
      }
      if(connected){ try{AndroidSerial.disconnect();}catch(e){} return; }
      try{
        AndroidSerial.connect();   // 结果经 onNativeSerialState 异步返回
        $('stat').textContent='正在请求 USB 权限并连接…';
      }catch(e){
        $('stat').innerHTML='<span style="color:#e74c3c">连接失败:'+esc(e.message)+'</span><br>确认 OTG 已接、已授权 USB。';
      }
    },
    fold:function(){
      var p=$('panel');
      var folded=p.classList.toggle('folded');
      $('foldBtn').textContent=folded?'+':'—';
    },
    diagnose:function(){
      var out=$('diagOut');
      out.style.display='block';
      if(!window.AndroidSerial){
        out.textContent='原生串口桥未就绪，请用 APK 打开本页（不是浏览器）';
        return;
      }
      try{
        var txt='=== USB 自诊断 '+new Date().toLocaleTimeString()+' ===\n';
        txt+='[桥对象] window.AndroidSerial: OK\n';
        txt+='[可用驱动] '+AndroidSerial.availableDrivers()+'\n';
        txt+='[当前连接] '+(AndroidSerial.isConnected()?'已连接':'未连接')+'\n';
        txt+='\n----- 原生层扫描（识别/权限/驱动）-----\n';
        txt+=AndroidSerial.diagnose();
        txt+='\n\n【判定指引】\n';
        txt+='· 识别设备数=0：检查 OTG 线/板子供电/USB 是否松动，换线试。\n';
        txt+='· 有设备但权限=待授权：重新点「连接串口」，手机会弹授权框，勾选允许。\n';
        txt+='· 有设备有权限但无驱动：把上面 vendorId/productId 发我，加驱动白名单。\n';
        txt+='· 一切正常仍连不上：把整屏截图发我，并说明扫描板芯片型号。';
        out.textContent=txt;
      }catch(e){
        out.textContent='诊断调用异常：'+e.message;
      }
      out.scrollTop=out.scrollHeight;
    }
  };
  window.App=App;

  // ===== 原生 USB 串口桥回调（MainActivity 注入 window.AndroidSerial）=====
  window.onNativeSerialLine=function(payload){
    var line=(typeof payload==='string')?payload:payload.line;
    handleLine(line);
  };
  window.onNativeSerialState=function(payload){
    connected=!!payload.connected;
    $('connBtn').textContent=connected?'⏹ 断开':'🔌 连接串口';
    var msg=payload.message||'';
    if(msg){
      var isError=/(失败|未|错误|占用|超时|拒绝|找不到)/.test(msg);
      var color=connected||!isError?'#2563eb':'#e74c3c';
      $('stat').innerHTML='<span style="color:'+color+'">'+esc(msg)+'</span>';
    }
    render();
  };

  // ===== 地图初始化（独立 try/catch，失败也不影响按钮与列表）=====
  try{
    if(!window.L){ throw new Error('Leaflet 库未加载（lib/leaflet.js 缺失）'); }
    makeIcons();
    map=L.map('map',{zoomControl:false}).setView([19.68,109.68],10);
    L.control.zoom({position:'bottomright'}).addTo(map);
    var street=L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
      {subdomains:'1234',maxZoom:18,attribution:'高德'});
    var sat=L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18});
    var label=L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18});
    street.addTo(map);
    L.control.layers({'街道图':street,'卫星图':L.layerGroup([sat,label])},{position:'bottomright'}).addTo(map);
    mapReady=true;
  }catch(e){
    mapReady=false;
    try{
      $('stat').innerHTML='<span style="color:#e74c3c">⚠️ 地图初始化失败（不影响连接/诊断按钮）:'+esc(e.message)+'</span><br>'+$('stat').innerHTML;
    }catch(_){}
  }

  // 首次渲染
  try{ render(); }catch(e){ window.dispatchEvent(new ErrorEvent('error',{message:'render 失败:'+e.message})); }
})();
</script>
</body>
</html>
